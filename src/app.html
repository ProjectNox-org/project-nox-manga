<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06070c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" />
    <script>
      (function () {
        if (typeof HTMLLinkElement !== 'undefined' && HTMLLinkElement.prototype.addEventListener) {
          var _origLinkAdd = HTMLLinkElement.prototype.addEventListener;
          HTMLLinkElement.prototype.addEventListener = function (type, fn, opts) {
            if ((type === 'load' || type === 'error') && !opts) {
              return _origLinkAdd.call(this, type, fn, { once: true });
            }
            return _origLinkAdd.call(this, type, fn, opts);
          };
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap"><div style="display: contents">%sveltekit.body%</div></body>
</html>
